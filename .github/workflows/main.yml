
name: Build Easing Viewer

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Geode mod
        uses: geode-sdk/build@main
        with:
          build-config: Release

      - name: Upload Geode mod
        uses: actions/upload-artifact@v4
        with:
          name: Easing-Viewer-Build
          path: build/*.geode
          if-no-files-found: error
